name: Repo Cassette raw payload

on:
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: payload
        uses: ./.github/actions/raw-upload
      - run: echo "ARTIFACT_ID=${{ steps.payload.outputs.artifact_id }}"
